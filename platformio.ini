; ButtonBox - projeto único com suporte a 3 placas:
;   - ESP32-WROOM-32  -> BLE HID (sem fio)
;   - Arduino Leonardo -> USB HID nativo (com fio)
;   - SparkFun Pro Micro (32U4, 16MHz/5V) -> USB HID nativo (com fio)
;
; A lógica de botões/eixos/LEDs é a mesma nas três. Tudo que é específico de
; plataforma (pinagem física e transporte HID) fica isolado em arquivos
; próprios, escolhidos automaticamente pelo build_src_filter de cada
; ambiente:
;
;   BoardConfigEsp32.cpp / BoardConfigAvr.cpp   -> pinagem física
;   GamepadOutputEsp32.cpp / GamepadOutputAvr.cpp -> transporte (BLE vs USB)
;
; Build:
;   pio run -e esp32dev   -t upload
;   pio run -e leonardo   -t upload
;   pio run -e promicro16 -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<BoardConfigAvr.cpp>
    -<GamepadOutput.cpp>
    -<GamepadOutputAvr.cpp>
    -<UsbGamepad.cpp>
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<BoardConfigEsp32.cpp>
    -<GamepadOutput.cpp>
    -<GamepadOutputEsp32.cpp>
    -<BleManager.cpp>
    -<HidGamepad.cpp>
lib_deps =
    mheironimus/Joystick @ ^2.1.1

[env:promicro16]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<BoardConfigEsp32.cpp>
    -<GamepadOutput.cpp>
    -<GamepadOutputEsp32.cpp>
    -<BleManager.cpp>
    -<HidGamepad.cpp>
lib_deps =
    mheironimus/Joystick @ ^2.1.1